services:
  app:
    image: ghcr.io/amptechnology-dev/attendance_frontend:latest
    container_name: attendance-frontend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3011"
    networks:
      - app-network
networks:
  app-network:
    external: true
    name: amp_portal_backend_app-network